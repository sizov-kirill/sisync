[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "sisync"
version = "0.1.0"
description = "Sync selected configuration files through Git using one YAML file."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.scripts]
sisync = "sisync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sisync"]

